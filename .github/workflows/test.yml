name: GadgetPick tests
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check Worker bundle
        run: npx wrangler deploy --dry-run
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Prepare runner-only database
        run: |
          npx wrangler d1 migrations apply gadgetpick-db --local
          npx wrangler d1 execute gadgetpick-db --local --file scripts/kitab-seed.sql
      - name: Start runner preview and test mobile workflows
        run: |
          npx wrangler dev --ip 127.0.0.1 --port 8787 > /tmp/gadgetpick-worker.log 2>&1 &
          node --test tests/browser/*.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-evidence
          path: |
            test-results/
            /tmp/gadgetpick-worker.log
          retention-days: 14
